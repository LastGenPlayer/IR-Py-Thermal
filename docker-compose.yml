services:
  irthermal:
    build: .
    image: irthermal:2
    container_name: irthermal
    restart: unless-stopped

    ports:
      - "8000:8000"

    # The cameras. One entry per device; `irthermal check-config` will tell you
    # what the configuration expects to find.
    devices:
      - /dev/video0:/dev/video0
      # - /dev/video2:/dev/video2
      # The load switch for lock-in runs, if there is one:
      # - /dev/ttyUSB0:/dev/ttyUSB0

    volumes:
      - ./config.toml:/etc/irthermal/config.toml:ro

    # The image puts its user in `video` and `dialout`, which are GID 44 and 20
    # on Debian and Ubuntu. Uncomment and correct these if your host numbers
    # them differently -- `getent group video` will say.
    # group_add:
    #   - "44"
    #   - "20"

    # The service reads devices and one config file and writes nothing, so it
    # has no business with a writable root filesystem.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    # Anything not set here comes from config.toml; these override it. Handy
    # for the one or two values that differ between hosts.
    # environment:
    #   IRTHERMAL__SERVER__LOG_FORMAT: console
