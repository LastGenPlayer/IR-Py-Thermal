# IRThermal configuration.
#
# Every value here can be overridden by an environment variable using a double
# underscore to descend, e.g. IRTHERMAL__SERVER__PORT=9000.
#
# Validate a file before deploying it:  irthermal check-config -c config.toml

[server]
host = "0.0.0.0"
port = 8000
log_level = "info"    # debug | info | warning | error
log_format = "json"   # json | console


# --- A camera monitoring a rack of SD cards ---------------------------------
[[cameras]]
id = "pi-rack"
device = "/dev/video0"
raw_mode = true            # sensor sends unprocessed data; correct it in software

# Where to keep the flat-field reference between runs. Only meaningful with
# raw_mode. A camera on a transport with no control channel cannot have its
# shutter closed, so its reference is taken by hand -- cover the lens, POST
# /calibrate -- and without this it would have to be retaken after every
# restart. Saved on calibration, reloaded on connect, ignored if it does not
# match the sensor.
calibration_file = "/var/lib/irthermal/pi-rack.npz"

# How to reach the camera: auto | v4l2 | ffmpeg.
#
#   auto    prefers V4L2 on Linux and falls back to ffmpeg; goes straight to
#           ffmpeg on Windows and macOS, where OpenCV decodes the sensor's
#           16-bit words to BGR before the driver can read them.
#   v4l2    Linux only. The only transport carrying the control channel, so
#           calibration, range switching and parameter writes need it.
#   ffmpeg  Any OS. Streaming and measurement only; control returns 501.
#
# `device` means whatever the transport names it: a V4L2 path on Linux, a
# DirectShow device name on Windows ("T2SPro"), an avfoundation index on macOS.
transport = "auto"
temperature_offset = 8.5   # constant trim, found once per camera
colormap = "inferno"
emissivity = 0.95

# Points are measured and exported every frame. `labels` become Prometheus
# labels on the thermal_point_celsius gauge, so group them however you query.
[[cameras.points]]
name = "hiend-1"
x = 43
y = 125
labels = { group = "hiend", slot = "1" }

[[cameras.points]]
name = "hiend-2"
x = 40
y = 111
labels = { group = "hiend", slot = "2" }

[[cameras.points]]
name = "ind-1"
x = 132
y = 120
labels = { group = "ind", slot = "1" }

[[cameras.points]]
name = "ultra-1"
x = 207
y = 123
labels = { group = "ultra", slot = "1" }


# --- A second camera, auto-detected, no fixed points ------------------------
[[cameras]]
id = "bench"
auto_detect = true
colormap = "jet"


# --- A camera set up for lock-in thermography -------------------------------
# The serial port lives here rather than in the API request, so that starting a
# run cannot be used to make the server open an arbitrary device. Leave
# lockin_port out when something else drives the load; the demodulation still
# runs, and the job reports its modulator as "external".
# [[cameras]]
# id = "die"
# device = "/dev/video2"
# lockin_port = "/dev/ttyUSB0"   # load switch: writes "1\n" on, "0\n" off
# lockin_baudrate = 115200
# lockin_invert = false          # true for a load wired active-low


