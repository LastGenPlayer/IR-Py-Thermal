[project]
name = "irthermal"
version = "2.0.0.dev0"
description = "Thermal camera server: HTTP API, MJPEG streaming and Prometheus metrics for XTherm / HT301 / InfiRay cameras"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Dima", email = "me@dmytroengineering.com" }]

dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/diminDDL/IR-Py-Thermal"

[project.scripts]
irthermal = "irthermal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irthermal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # import sorting
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ANN",              # annotations
    "NPY",              # numpy
    "PTH",              # pathlib
    "RET", "ARG", "C4", "DTZ", "ICN", "PIE", "TID",
]
ignore = [
    "ANN401",  # Any is occasionally the honest type
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG"]

[tool.mypy]
python_version = "3.12"
packages = ["irthermal"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cv2.*", "serial.*"]
ignore_missing_imports = true
